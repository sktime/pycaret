name: pycaret

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    name: Code quality checks
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
      - name: Run black
        uses: psf/black@stable
        with:
          src: pycaret tests
          version: 24.8.0
      - name: Check imports
        uses: jamescurtin/isort-action@master
        with:
          sort-paths: pycaret tests
          isort-version: 5.13.2
      - name: Run flake8
        uses: py-actions/flake8@v2
        with:
          path: pycaret tests
          flake8-version: 7.1.1

  detect:
    name: Detect changes
    needs: code-quality
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pycaret: ${{ steps.filter.outputs.pycaret }}
      notebooks: ${{ steps.filter.outputs.notebooks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to diff against the base branch
      - id: filter
        name: Detect changed files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # on push to main, always run everything
            echo "pycaret=true" >> "$GITHUB_OUTPUT"
            echo "notebooks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # compare against the merge base with the PR target branch
          BASE=$(git merge-base HEAD origin/${{ github.base_ref }})
          echo "Comparing against $BASE"

          changed_files=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files:"
          echo "$changed_files"

          pycaret=false
          notebooks=false

          if echo "$changed_files" | grep -qE '^(pycaret/|tests/|datasets/|pyproject\.toml|setup\.cfg|\.github/workflows/)'; then
            pycaret=true
          fi

          if echo "$changed_files" | grep -qE '^(tutorials/|pycaret/|datasets/|pyproject\.toml|\.github/workflows/)'; then
            notebooks=true
          fi

          echo "pycaret=$pycaret" >> "$GITHUB_OUTPUT"
          echo "notebooks=$notebooks" >> "$GITHUB_OUTPUT"

          echo "pycaret=$pycaret"
          echo "notebooks=$notebooks"

  # JOBS MUST START WITH test !!!!
  test-core:
    name: Test core dependency set
    needs: detect
    if: ${{ needs.detect.outputs.pycaret == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip' # caching pip dependencies
      - name: Install core dependencies only
        run: |
          python -m pip install -U pip
          python -m pip install -U uv
          python -m uv pip install . pytest pytest-timeout
      - name: Python version and dependency list
        run: |
          python --version
          which python
          pip list
      - name: Check module imports with core install
        run: |
          python -c "
          import pycaret
          import pycaret.anomaly
          import pycaret.classification
          import pycaret.clustering
          import pycaret.datasets
          import pycaret.regression
          import pycaret.time_series
          "
      - name: Test with pytest
        run: pytest --durations=0 -m "not (benchmark or plotting or tuning_random or tuning_grid)"

  test-notebooks-regression:
    name: Test notebook (Regression)
    needs: detect
    if: ${{ needs.detect.outputs.notebooks == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
      - name: Set up Python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip' # caching pip dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          python -m uv pip install -U pytest pytest-xdist nbmake

          # https://github.com/yaml/pyyaml/issues/736
          echo 'Cython < 3.0' > /tmp/constraint.txt
          PIP_BUILD_CONSTRAINT=/tmp/constraint.txt pip wheel PyYAML==5.4.1

          python -m uv pip install ".[full]"
          python -m ipykernel install --user --name cikernel
      - name: Python version and dependency list
        run: |
          echo "Python version expected: 3.12"
          python --version
          which python
          pip list
      - name: Run notebook
        run: pytest --nbmake --nbmake-kernel=cikernel --nbmake-timeout=3000 "tutorials/Tutorial - Regression.ipynb"

  test-notebooks:
    name: Test notebooks (excluding Regression)
    needs: detect
    if: ${{ needs.detect.outputs.notebooks == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
      - name: Set up Python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip' # caching pip dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          python -m uv pip install -U pytest pytest-xdist nbmake

          # https://github.com/yaml/pyyaml/issues/736
          echo 'Cython < 3.0' > /tmp/constraint.txt
          PIP_BUILD_CONSTRAINT=/tmp/constraint.txt pip wheel PyYAML==5.4.1

          python -m uv pip install ".[full]"
          python -m ipykernel install --user --name cikernel
      - name: Python version and dependency list
        run: |
          echo "Python version expected: 3.12"
          python --version
          which python
          pip list
      - name: Run notebooks
        run: pytest --nbmake --nbmake-kernel=cikernel -n=auto --nbmake-timeout=3000 --ignore=./tutorials/translations --ignore="tutorials/Tutorial - Regression.ipynb" ./tutorials/

  test:
    name: Full tests (py-${{ matrix.python-version }}, ${{ matrix.os }})
    needs: detect
    if: ${{ needs.detect.outputs.pycaret == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ 'ubuntu-latest', 'windows-latest' ]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # caching pip dependencies
      - name: Install dependencies
        # SKLEARN_ALLOW_DEPRECATED_SKLEARN_PACKAGE_INSTALL required due to
        # pyLDAvis 3.3.1 having an "sklearn" dependency
        run: |
          export SKLEARN_ALLOW_DEPRECATED_SKLEARN_PACKAGE_INSTALL=True
          python -m pip install -U pip
          python -m pip install -U uv
          python -m uv pip install -U pytest numpy

          # https://github.com/yaml/pyyaml/issues/736
          echo 'Cython < 3.0' > /tmp/constraint.txt
          PIP_BUILD_CONSTRAINT=/tmp/constraint.txt pip wheel PyYAML==5.4.1

          python -m uv pip install ".[full, test]"
          if [ -f requirements-prophet.txt ]; then pip install -r requirements-prophet.txt; fi
      - name: Python version and dependency list
        run: |
          echo "Python version expected: ${{ matrix.python-version }}"
          python --version
          which python
          pip list
      - name: Test with pytest
        run: pytest --durations=0 -m "not (benchmark or plotting or tuning_random or tuning_grid)"

  test-plots:
    name: Test plotting
    needs: detect
    if: ${{ needs.detect.outputs.pycaret == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # caching pip dependencies
      - name: Install dependencies
        # SKLEARN_ALLOW_DEPRECATED_SKLEARN_PACKAGE_INSTALL required due to
        # pyLDAvis 3.3.1 having an "sklearn" dependency
        run: |
          export SKLEARN_ALLOW_DEPRECATED_SKLEARN_PACKAGE_INSTALL=True
          python -m pip install --upgrade pip
          python -m pip install uv
          python -m uv pip install -U pytest numpy

          # https://github.com/yaml/pyyaml/issues/736
          echo 'Cython < 3.0' > /tmp/constraint.txt
          PIP_BUILD_CONSTRAINT=/tmp/constraint.txt pip wheel PyYAML==5.4.1

          python -m uv pip install ".[full, test]"
      - name: Python version and dependency list
        run: |
          echo "Python version expected: ${{ matrix.python-version }}"
          python --version
          which python
          pip list
      - name: Test with pytest
        run: pytest --durations=0 -m "plotting"

  test-tune:
    name: Test tuning
    needs: detect
    if: ${{ needs.detect.outputs.pycaret == 'true' }}
    timeout-minutes: 90
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # caching pip dependencies
      - name: Install dependencies
        # SKLEARN_ALLOW_DEPRECATED_SKLEARN_PACKAGE_INSTALL required due to
        # pyLDAvis 3.3.1 having an "sklearn" dependency
        run: |
          export SKLEARN_ALLOW_DEPRECATED_SKLEARN_PACKAGE_INSTALL=True
          python -m pip install -U pip
          python -m pip install -U uv
          python -m uv pip install -U pytest numpy

          # https://github.com/yaml/pyyaml/issues/736
          echo 'Cython < 3.0' > /tmp/constraint.txt
          PIP_BUILD_CONSTRAINT=/tmp/constraint.txt pip wheel PyYAML==5.4.1

          python -m uv pip install ".[full, test]"
          if [ -f requirements-prophet.txt ]; then pip install -r requirements-prophet.txt; fi
      - name: Python version and dependency list
        run: |
          echo "Python version expected: ${{ matrix.python-version }}"
          python --version
          which python
          pip list
      - name: Test with pytest
        run: pytest --durations=0 -m "tuning_random or tuning_grid"
