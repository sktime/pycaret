name: pycaret

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 5 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_quality:
    runs-on: ubuntu-latest
    name: Code quality checks
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
      - name: Run black
        uses: psf/black@stable
        with:
          src: pycaret tests
          version: 24.8.0
      - name: Check imports
        uses: jamescurtin/isort-action@master
        with:
          sort-paths: pycaret tests
          isort-version: 5.13.2
      - name: Run flake8
        uses: py-actions/flake8@v2
        with:
          path: pycaret tests
          flake8-version: 7.1.1

  test_windows_lightgbm_failures:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]

    name: Focused LightGBM failures on Windows Python ${{ matrix.python-version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        # SKLEARN_ALLOW_DEPRECATED_SKLEARN_PACKAGE_INSTALL required due to
        # pyLDAvis 3.3.1 having an "sklearn" dependency
        run: |
          export SKLEARN_ALLOW_DEPRECATED_SKLEARN_PACKAGE_INSTALL=True
          python -m pip install -U pip
          python -m pip install -U uv
          python -m uv pip install -U pytest numpy

          # https://github.com/yaml/pyyaml/issues/736
          echo 'Cython < 3.0' > /tmp/constraint.txt
          PIP_BUILD_CONSTRAINT=/tmp/constraint.txt pip wheel PyYAML==5.4.1

          python -m uv pip install ".[full, test]"
          if [ -f requirements-prophet.txt ]; then pip install -r requirements-prophet.txt; fi
      - name: Python version and dependency list
        run: |
          echo "Python version expected: ${{ matrix.python-version }}"
          python --version
          which python
          python -c "import lightgbm; print('LightGBM version:', lightgbm.__version__)"
          pip list
      - name: Run failed LightGBM tests
        run: |
          pytest tests/test_time_series_base.py -k "test_create_predict_finalize_model and lightgbm_cds_dt"
          pytest \
            tests/test_check_fairness.py::test_check_fairness_binary_classification \
            tests/test_check_fairness.py::test_check_fairness_multiclass_classification \
            tests/test_check_fairness.py::test_check_fairness_regression \
            'tests/test_classification.py::test_classification[True]' \
            'tests/test_classification.py::test_classification[False]' \
            tests/test_classification.py::TestClassificationExperimentCustomTags::test_classification_models_with_experiment_custom_tags \
            tests/test_models.py::test_model_equality_classification \
            tests/test_models.py::test_model_equality_regression \
            tests/test_models.py::test_model_equality_time_series \
            'tests/test_multiclass.py::test_multiclass[True]' \
            'tests/test_multiclass.py::test_multiclass[False]' \
            tests/test_overflow.py::test_overflow_gbr_lightgbm \
            tests/test_preprocess.py::test_weird_chars_in_column_names_no_impact_on_other_preprocessors \
            'tests/test_preprocess.py::test_iterative_imputer[lightgbm-mixed]' \
            'tests/test_preprocess.py::test_iterative_imputer[lightgbm-num_only]' \
            'tests/test_preprocess.py::test_iterative_imputer[lightgbm-cat_only]' \
            'tests/test_regression.py::test_regression[True]' \
            'tests/test_regression.py::test_regression[False]' \
            tests/test_utils.py::test_utils \
            'tests/test_time_series_blending.py::test_blend_model_basic[mean]' \
            'tests/test_time_series_blending.py::test_blend_model_basic[median]' \
            'tests/test_time_series_blending.py::test_blend_model_basic[min]' \
            'tests/test_time_series_blending.py::test_blend_model_basic[max]' \
            'tests/test_time_series_blending.py::test_blend_model_basic[gmean]' \
            tests/test_time_series_blending.py::test_blend_model_predict \
            tests/test_time_series_blending.py::test_error_conditions

