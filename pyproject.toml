[project]
name = "pycaret-core"
version = "3.5.0"
description = "PyCaret - An open source, low-code machine learning library in Python."
readme = "README.md"
keywords = [
  "data-mining",
  "data-science",
  "classification",
  "clustering",
  "detection",
  "forecasting",
  "machine-learning",
  "regression",
  "time-series",
]
license = { file = "LICENSE" }
maintainers = [
  { name = "pycaret developers" },
]
# for full credits see contributors.md
authors = [
    { name = "pycaret developers" },
]
requires-python = ">=3.10,<3.15"
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development",
]
# core dependencies of pycaret
# this set should be kept minimal!
dependencies = [
  "scikit-base>=0.6.1",
  "ipython>=5.5.0",
  "tqdm>=4.62.0",
  "numpy>=1.21,<2.0; python_version<'3.13'",
  "numpy>=2.0,<3; python_version>='3.13'",
  "pandas>=1.5.0,<2.2; python_version<'3.13'",
  "pandas>=2.2.0; python_version>='3.13'",
  "jinja2>=3",
  "scipy>=1.6.1,<=1.11.4; python_version<'3.13'",
  "scipy>=1.14.0,<2; python_version>='3.13'",
  "joblib>=1.4.2",
  "scikit-learn>=1.4,<1.5; python_version<'3.13'",
  "scikit-learn>=1.5; python_version>='3.13'",
  "imbalanced-learn>=0.12.0",
  "category-encoders>=2.4.0",
  "requests>=2.27.1",
  "psutil>=5.9.0",
  "cloudpickle",
  "xxhash",
  "packaging>=21.0",
  "sktime>=0.31.0",
]

[project.optional-dependencies]
# there are the following dependency sets:
# - full - curated set of soft dependencies, see below
# - analysis
# - models
# - tuners
# - mlops
# - parallel
# - plotting
# - dev
# - test

# soft dependencies are not required for the core functionality of pycaret

# full - curated set of soft dependencies:
# should contain only framework level soft dependencies.
# dependencies severely capping a core dependency should not be included.
#
# users can install via "pip install pycaret-core[full]"
#
full = [
  "pycaret-core[analysis,mlops,models,parallel,plotting,tuners]",
]

analysis = [
  "pyod>=1.1.3",
  "lightgbm>=3.0.0,<4.7.0; python_version < '3.13'",
  "lightgbm>=3.0.0; python_version >= '3.13'",
  "numba>=0.55.0; python_version<'3.13'",
  "numba>=0.60.0,<0.68; python_version>='3.13'",
  "shap>=0.49.1,<0.50.0; python_version < '3.13'",
  "shap>=0.50.0; python_version >= '3.13'",
  "interpret>=0.2.7",
  "umap-learn>=0.5.2",
  "pyyaml",
  "ydata-profiling>=4.3.1,<4.13; python_version<'3.10'",
  "ydata-profiling>=4.13.0; python_version>='3.10'",
  "standard-imghdr; python_version>='3.13'",
  "explainerdashboard>=0.3.8",
  "fairlearn>=0.7.0",
]

models = [
  "xgboost>=2.0.0,<3.1.0; python_version < '3.13'",
  "xgboost>=3.1.1; python_version >= '3.13'",
  "catboost>=1.2.5",
  "kmodes>=0.11.1",
  "mlxtend>=0.19.0",
  "statsforecast>=1.6.0,<=2.1.1",
  "statsmodels>=0.12.1,<0.15.0",
  "tbats>=1.1.3",
  "pmdarima>=2.0.4; python_version<'3.13'",
  "pmdarima>=2.1.0; python_version>='3.13'",
  "scikit-learn-intelex==2024.2.0; python_version == '3.10' and platform_system == 'Windows' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
  "scikit-learn-intelex>=2024.0.0; (python_version != '3.10' or platform_system != 'Windows') and (platform_machine == 'x86_64' or platform_machine == 'AMD64') and platform_system != 'Darwin'",
]

tuners = [
  "tune-sklearn; python_version<'3.13'",
  "ray[tune]; python_version<'3.13'",
  "hyperopt>=0.2.7",
  "optuna>=3.0.0",
  "optuna-integration",
  "scikit-optimize>=0.9.0; python_version<'3.12'",
]

mlops = [
  "mlflow>=2.0.0",
  "gradio>=3.50.2",
  "boto3>=1.24.56",
  "fastapi",
  "uvicorn>=0.17.6",
  "m2cgen>=0.9.0",
  "evidently>=0.7.0,<0.8.0",
]

parallel = [
  "dask>=2024.1.0",
  "distributed>=2024.1.0",
  "fugue[dask]>=0.9.0",
  "flask",
  "Werkzeug>=2.2,<=3.2",
]

plotting = [
  "ipywidgets>=7.6.5",
  "matplotlib>=3.5.0,<3.12.0; python_version<'3.13'",
  "matplotlib>=3.8.0,<3.12.0; python_version>='3.13'",
  "mljar-scikit-plot",
  "plotly>=5.14.0",
  "kaleido>=0.2.1",
  "schemdraw==0.15",
  "plotly-resampler>=0.8.3.1",
  "dash-bootstrap-components<3.0.0",
]

prophet = [
  "prophet>=1.0.1",
]

# dev - the developer dependency set, for contributors
dev = [
  "ruff<0.17",
  "mypy>=1,<2.4",
]

# docs - the dependency set used for doc build
docs = [
  "sphinx>=3.0.0",
  "pydata-sphinx-theme",
  "sphinx-copybutton",
  "numpy",
]


# CI related soft dependency sets - not for users of pycaret
# they are stable and subject to deprecation policies
test = [
  "anywidget>=0.9.13",
  "pytest>=8.0.0",
  "moto>=4.0.0",
  "fugue[dask]",
  "dash[testing]",
  "pytest-timeout",
]


[project.urls]
"API Reference" = "https://www.pycaret.net/en/latest/"
Documentation = "https://www.pycaret.net/en/latest/"
Download = "https://pypi.org/project/pycaret-core/#files"
Homepage = "https://www.pycaret.net/en/latest/"
"Release Notes" = "https://github.com/sktime/pycaret/releases"
Repository = "https://github.com/sktime/pycaret"

[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>61",
]

[tool.setuptools.packages.find]
include = ["pycaret", "pycaret.*"]

[tool.ruff]
line-length = 88
# tutorial notebooks use `import *` by design and need their own rule set;
# see https://github.com/sktime/pycaret/issues/99
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# default rule set (pycodestyle errors, pyflakes) plus isort
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
  # Assign a lambda expression
  "E731",
]

[tool.ruff.lint.per-file-ignores]
# Imported but unused
"__init__.py" = ["F401"]
"pycaret/distributions.py" = ["F401"]
"pycaret/internal/preprocess/iterative_imputer.py" = ["F401"]
"pycaret/internal/display/display_backend.py" = ["F401"]
# Redefinition of unused imports
"pycaret/containers/models/classification.py" = ["F811"]
"pycaret/containers/models/clustering.py" = ["F811"]
"pycaret/containers/models/regression.py" = ["F811"]
"pycaret/containers/models/time_series.py" = ["F811"]
# Local variable is assigned to but never used
"tests/test_time_series_mlflow.py" = ["F841"]
# Module level import not at top of file (intentional - after pytest.importorskip)
"tests/test_clustering_engines.py" = ["E402"]


[tool.pytest]
ini_options.addopts = """
  -rfEXsS -p pytester --strict-markers --verbosity=3
  """
ini_options.testpaths = "tests/"
ini_options.python_files = "*.py"
ini_options.python_functions = "test_*"
ini_options.markers = [
  "benchmark",
  "plotting",
  "tuning_grid",
  "tuning_random",
]
